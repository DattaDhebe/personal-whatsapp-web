name: whatsapp_web
description: WhatsApp Web accessible on Android devices.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Material Design
  cupertino_icons: ^1.0.2
  
  # WebView
  webview_flutter: ^4.2.0
  
  # Socket.io
  socket_io_client: ^2.0.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # State Management
  provider: ^6.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Notifications
  flutter_local_notifications: ^16.1.0
  
  # Date/Time
  intl: ^0.18.0
  
  # Utilities
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
